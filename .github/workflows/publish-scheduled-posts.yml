# Merges a branch named scheduled/YYYY-MM-DD into main on that date, Pacific time.
# The branch is deleted only once the post is live, so a later run can finish the job.
name: Publish scheduled posts

on:
  schedule:
    # Every 15 minutes from 08:07 Pacific to the end of the day, since GitHub drops many
    # scheduled runs. A run with nothing due exits at once. Hours are UTC.
    - cron: '7,22,37,52 8-23 31 10 *'  # 31 October: nothing due, measures how often runs fire
    - cron: '7,22,37,52 0-5 1 11 *'
    - cron: '7,22,37,52 16-23 1 11 *'  # 1 November (PST)
    - cron: '7,22,37,52 0-7 2 11 *'
    - cron: '7,22,37,52 16-23 2 11 *'  # 2 November (PST)
    - cron: '7,22,37,52 0-7 3 11 *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency: publish-scheduled-posts

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Merge the post due today
        id: merge
        run: |
          branch="scheduled/$(TZ=America/Los_Angeles date +%F)"
          if ! git ls-remote --exit-code --heads origin "$branch" > /dev/null; then
            echo "Nothing is due for $branch."
            exit 0
          fi
          git fetch origin "$branch"
          git config user.name "chenyangsu"
          git config user.email "chenyangsu@users.noreply.github.com"
          git merge --no-edit "origin/$branch"
          git push origin HEAD:main
          echo "branch=$branch" >> "$GITHUB_OUTPUT"
      - name: Ask Pages to build
        if: steps.merge.outputs.branch
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${{ github.repository }}/pages/builds"
      - name: Confirm it is live, then delete the branch
        if: steps.merge.outputs.branch
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ steps.merge.outputs.branch }}
        run: |
          sha=$(git rev-parse HEAD)
          post=$(git show --name-only --diff-filter=A --format= "origin/$BRANCH" -- 'blog/*/index.html')
          url="https://chenyangsu.github.io/${post%index.html}?run=$GITHUB_RUN_ID"
          for i in $(seq 1 40); do
            build=$(gh api "repos/$GITHUB_REPOSITORY/pages/builds/latest" --jq '"\(.commit) \(.status)"' || true)
            if [ "$build" = "$sha built" ] && { [ -z "$post" ] || curl -sfo /dev/null "$url"; }; then
              echo "Live: $sha ${post:-no new post}"
              git push origin --delete "$BRANCH"
              exit 0
            fi
            sleep 30
          done
          echo "Not live after 20 minutes: $BRANCH, last build: $build"
          exit 1
