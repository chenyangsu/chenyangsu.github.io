# Merges a branch named scheduled/YYYY-MM-DD into main on that date, Pacific time.
name: Publish scheduled posts

on:
  schedule:
    - cron: '7 15 31 10 *'  # 31 October, 08:07 Pacific (PDT)
    - cron: '7 16 1 11 *'   # 1 November, 08:07 Pacific (PST)
  workflow_dispatch:

permissions:
  contents: write
  pages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Merge the post due today
        id: merge
        run: |
          branch="scheduled/$(TZ=America/Los_Angeles date +%F)"
          if ! git ls-remote --exit-code --heads origin "$branch" > /dev/null; then
            echo "Nothing is due for $branch."
            exit 0
          fi
          git fetch origin "$branch"
          git config user.name "chenyangsu"
          git config user.email "chenyangsu@users.noreply.github.com"
          git merge --no-edit "origin/$branch"
          git push origin HEAD:main
          git push origin --delete "$branch"
          echo "merged=true" >> "$GITHUB_OUTPUT"
      - name: Ask Pages to build
        if: steps.merge.outputs.merged == 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${{ github.repository }}/pages/builds"
